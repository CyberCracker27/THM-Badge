name: Update Live THM Badge

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  generate-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run badge generator
        run: python generate_badge.py
        env:
          THM_USERNAME: ${{ secrets.THM_USERNAME }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tryhackme_badge.png
          git diff --staged --quiet || git commit -m "Auto-update THM badge [skip ci]"
          git push

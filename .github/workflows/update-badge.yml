name: Generate TryHackMe Badge

on:
  push:
    paths:
      - 'data.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Generate badge
        run: python generate_badge.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tryhackme_badge.png
          git diff --staged --quiet || git commit -m "Update badge [skip ci]"
          git push

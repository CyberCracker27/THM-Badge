name: Generate TryHackMe Badge

on:
  push:
    paths:
      - 'data.json'
  workflow_dispatch:

# Prevent two badge builds from racing over the same branch.
concurrency:
  group: thm-badge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate badge
        run: python generate_badge.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tryhackme_badge.png docs/avatar.jpg

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: update THM badge [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

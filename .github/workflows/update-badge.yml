name: Update TryHackMe Badge

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:      # manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run badge generator
        run: python scripts/fetch_and_generate.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tryhackme_badge.png
          git diff --staged --quiet || git commit -m "Update THM badge [skip ci]"
          git push
